# Information about how to become a support member.
- text: >-

    Haluatko olla mukana tukemassa Päiväkoti Omenapuun toimintaa? Kannatusjäsenenä tuet Omenapuun toimintaa ja olet mukana mahdollistamassa hyvää ja viihtyisää päiväkotiarkea lapsille.
    Kannatusjäsenmaksu on 20 € vuodessa.

- title: Liittyminen on helppoa
  text: >-
    Maksa 20 € kannatusjäsenmaksu.<br />
    Saaja: Mäntsälän päiväkotiyhdistys Omenapuu<br />
    Tilinumero: FI07 5282 0120 0251 41<br />
    Kirjoita viestikenttään: Kannatusjäsenyys + oma nimi<br />
    Lähetä maksamisen jälkeen kuitti sähköpostitse yhteystiedoista löytyvään osoitteeseen.<br />
    <br /> 
    Lämmin kiitos, että olet mukana tukemassa Omenapuuta!
